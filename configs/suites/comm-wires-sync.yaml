# @package _global_
# Paper single-module Wires set (10 missions), sync self-play.

defaults:
  - /manual@suite.manual_profile: vanilla

suite:
  _target_: gptnt.experiments.suite.definition.Suite
  name: comm-wires-sync
  revision: 2
  modality: [vision, language]
  missions_path: configs/missions/wires_10
  manual_rule_seed: 1764
  defuser_protocol:
    _target_: gptnt.players.specification.PlayerProtocol
    role: defuser
    communication_style: sync
    is_playing_alone: false
    include_manual: false
  expert_protocol:
    _target_: gptnt.players.specification.PlayerProtocol
    role: expert
    communication_style: sync
    is_playing_alone: false
    include_manual: true
  matchup:
    _target_: gptnt.experiments.suite.definition.SuiteMatchup
    pairing_type: with_best_expert
  manual_profile:
    _target_: gptnt.ktane.manuals.profile.ManualProfile
